[package]
name = "torrents_auto_updater"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15"
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transmission-rpc = "0.5"
